name: Package Multi-OS Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: scm-windows-x64.exe
            asset_path: dist/scm.exe
            build_command: |
              pyinstaller --clean --noconfirm --onefile --name scm --console --add-data "dev;dev" SimpleCredentialManagerCli.py
          - os: macos-latest
            artifact_name: scm-macos-x64
            asset_path: dist/scm
            build_command: |
              pyinstaller --clean --noconfirm --onefile --name scm SimpleCredentialManagerCli.py
          - os: ubuntu-latest
            artifact_name: scm-linux-x64
            asset_path: dist/scm
            build_command: |
              pyinstaller --clean --noconfirm --onefile --name scm SimpleCredentialManagerCli.py

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build standalone binary with PyInstaller
        run: ${{ matrix.build_command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  build-linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build AppDir & AppImage
        run: |
          pyinstaller --clean --noconfirm --onedir --name scm SimpleCredentialManagerCli.py
          mkdir -p AppDir/usr/bin
          cp -r dist/scm/* AppDir/usr/bin/
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/scm" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat << 'EOF' > AppDir/scm.desktop
          [Desktop Entry]
          Name=Simple Credential Manager
          Exec=AppRun
          Icon=scm
          Type=Application
          Categories=Utility;Security;
          EOF
          touch AppDir/scm.png
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/scm-linux-x86_64.AppImage || true

      - name: Upload Linux AppImage Artifact
        if: hashFiles('dist/*.AppImage') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scm-linux-x86_64.AppImage
          path: dist/scm-linux-x86_64.AppImage

  release:
    needs: [build, build-linux-appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
